name: Build ZIPs for all problem directories


on:
  push:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Find problem directories
        id: list
        run: |
          # Exclude explicitly named directories and avoid `.` by using -mindepth 1
          dirs=$(find . -maxdepth 1 -mindepth 1 -type d \
            ! -name ".github" \
            ! -name ".git")

          # Convert to a compact JSON array (single line) so it can be safely written to GITHUB_OUTPUT
          printf '%s\n' "$dirs" | jq -R . | jq -s -c . > dirs.json

          # Write to GITHUB_OUTPUT (single-line value is safe)
          echo "dirs=$(cat dirs.json)" >> $GITHUB_OUTPUT

      - name: Create ZIPs
        run: |
          dirs=${{ steps.list.outputs.dirs }}
          echo "$dirs" | jq -r '.[]' | while read -r d; do
            name=$(basename "$d")
            # Create ZIP with the directory contents at the root of the archive (no top-level directory)
            (cd "$d" && zip -r "../${name}.zip" .)
          done

      - name: Upload ZIPs to Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: auto-zip-latest
          files: "*.zip"
