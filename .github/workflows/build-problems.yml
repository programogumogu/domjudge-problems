name: Build ZIPs for all problem directories

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Find problem directories
        id: list
        run: |
          dirs=$(find . -maxdepth 1 -type d ! -name "." ! -name ".github")
          # 改行を安全に扱うために JSON 配列に変換
          printf '%s\n' "$dirs" | jq -R . | jq -s . > dirs.json
          echo "dirs=$(cat dirs.json)" >> $GITHUB_OUTPUT

      - name: Create ZIPs
        run: |
          dirs=${{ steps.list.outputs.dirs }}
          echo "$dirs" | jq -r '.[]' | while read d; do
            name=$(basename "$d")
            zip -r "${name}.zip" "$d"
          done

      - name: Upload ZIPs to Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: auto-zip-latest
          files: "*.zip"
